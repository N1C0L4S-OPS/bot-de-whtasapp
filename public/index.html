<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dent's Bot - Panel de Control</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">MY DENT'S BOT</div>
      <div class="subtitle">Panel de Control - WhatsApp</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalReminders">0</div>
        <div class="stat-label">Recordatorios Enviados</div>
      </div>
      <div class="stat-card success">
        <div class="stat-value" id="sentReminders">0</div>
        <div class="stat-label">Exitosos</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-value" id="failedReminders">0</div>
        <div class="stat-label">Fallidos</div>
      </div>
      <div class="stat-card info">
        <div class="stat-value" id="totalConversations">0</div>
        <div class="stat-label">Conversaciones</div>
      </div>
    </div>

    <div class="config-section">
      <h3>Configuración Actual</h3>
      <div class="config-grid">
        <div class="config-item">
          <span class="config-label">Modo de Respuesta:</span>
          <span class="config-value" id="responseMode">-</span>
        </div>
        <div class="config-item">
          <span class="config-label">Palabra Clave:</span>
          <span class="config-value" id="keywordTrigger">-</span>
        </div>
        <div class="config-item">
          <span class="config-label">Recordatorio 24h:</span>
          <span class="config-value" id="reminder24h">-</span>
        </div>
        <div class="config-item">
          <span class="config-label">Recordatorio 3h:</span>
          <span class="config-value" id="reminder3h">-</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Últimos Recordatorios</h3>
      <div id="remindersList" class="list-container">Cargando...</div>
    </div>

    <div class="section">
      <h3>Últimos Mensajes</h3>
      <div id="messagesList" class="list-container">Cargando...</div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
